<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filipino Music Discovery</title>
    <style>
        body {
            background: linear-gradient(135deg, #fff0f6 0%, #ffffff 100%);
            color: #4a4a4a;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(255, 182, 193, 0.2);
            width: 100%;
            max-width: 450px;
            text-align: center;
            border: 1px solid #ffe3ec;
        }
        h1 { color: #ff74a4; margin-bottom: 10px; font-weight: 700; }
        p { color: #8e8e8e; margin-bottom: 30px; font-size: 0.95rem; }
        .form-group { text-align: left; margin-bottom: 20px; }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #ff99bc;
        }
        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ffe3ec;
            background-color: #fffafc;
            color: #4a4a4a;
            font-size: 1rem;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(to right, #ff99bc, #ff74a4);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 116, 164, 0.3);
            margin-top: 10px;
        }
        .result-container {
            margin-top: 35px;
            padding-top: 25px;
            border-top: 2px solid #fff0f6;
            text-align: left;
        }
        .song-card {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #fff5f8;
        }
        .song-title { color: #ff4d8d; font-size: 1.3rem; display: block; font-weight: 800; }
        .artist-name { color: #7a7a7a; font-size: 1rem; font-style: italic; }
        .genre-tag { color: #ff99bc; font-size: 0.8rem; font-weight: 600; display: block; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌸 Filipino Music Discovery</h1>
        <p>Find the perfect OPM track based on your vibe</p>
        
        <form action="/predict" method="post">
            <div class="form-group">
                <label>Artist</label>
                <select name="artist">
                    <option value="Any" {% if selected_artist == 'Any' %}selected{% endif %}>-- Any Artist --</option>
                    {% for artist in artists %}
                        <option value="{{ artist }}" {% if selected_artist == artist %}selected{% endif %}>{{ artist }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Genre</label>
                <select name="genre">
                    <option value="Any" {% if selected_genre == 'Any' %}selected{% endif %}>-- Any Genre --</option>
                    {% for genre in genres %}
                        <option value="{{ genre }}" {% if selected_genre == genre %}selected{% endif %}>{{ genre }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Year</label>
                <select name="year">
                    <option value="Any" {% if selected_year == 'Any' %}selected{% endif %}>-- Any Year --</option>
                    {% for year in years %}
                        <option value="{{ year }}" {% if selected_year == year|string %}selected{% endif %}>{{ year }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit">Get Recommendations</button>
        </form>

        {% if recommendations %}
        <div class="result-container">
            <label style="color: #ff74a4; margin-bottom: 15px; display: block;">Top 3 Matches:</label>
            {% for song in recommendations %}
            <div class="song-card">
                <strong class="song-title">{{ song['Song'] }}</strong>
                <span class="artist-name">by {{ song['Artist'] }}</span>
                <span class="genre-tag">Genre: {{ song['Genre'] }}</span>
            </div>
            {% endfor %}
        </div>
        {% endif %}
    </div>
</body>
</html>
